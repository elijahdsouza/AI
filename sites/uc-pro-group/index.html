<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="UC Pro is where founders, operators and small business owners who’ve outgrown their circle find the people who match where they’re going, and stop building alone. Melbourne. Founding rate closes 29 October 2026." />
    <meta name="theme-color" content="#0e0d0b" />
    <meta property="og:title" content="UC Pro Group · Uncommon Collective" />
    <meta property="og:description" content="Making it easier, and more common, to build the life behind the business." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230e0d0b'/%3E%3Cpath d='M17.04,6.76A3.9,3.9 0 0 1 22.38,12.44L15.74,18.69A3.94,3.94 0 0 0 21.15,24.43L27.79,18.19A3.9,3.9 0 0 1 33.13,23.86L25.42,31.11A11.74,11.74 0 0 1 9.34,14.01L17.04,6.76ZM10.48,12.94A3.9,3.9 0 0 1 15.82,18.61M21.22,24.36A3.9,3.9 0 0 1 26.56,30.03' fill='none' stroke='%23bbab69' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Opened as a file from a folder, a build that loads its code from separate
      // files is blocked by the browser. Explain what to open instead of a blank page.
      document.addEventListener("DOMContentLoaded", function () {
        if (location.protocol !== "file:" || !document.querySelector('script[type="module"][src]')) return;
        var root = document.getElementById("root");
        if (!root || root.childNodes.length) return;
        root.innerHTML = `
          <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#0e0d0b;color:#f3efe6;font:16px/1.6 system-ui,sans-serif">
            <div style="max-width:560px">
              <p style="margin:0 0 14px;font:500 12px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#bbab69">UC Pro Group</p>
              <h1 style="margin:0 0 12px;font:700 28px/1.2 Georgia,serif">This copy only runs from a web server</h1>
              <p style="margin:0 0 18px;color:#cfc8b8">Browsers block its code when it's opened as a file on your computer, so it would show a blank page.</p>
              <ul style="margin:0;padding-left:20px;color:#cfc8b8">
                <li style="margin-bottom:8px"><b style="color:#f3efe6">To look at the site:</b> double-click <b style="color:#f3efe6;white-space:nowrap">UC-Pro-Group.html</b> instead.</li>
                <li style="margin-bottom:8px"><b style="color:#f3efe6">To run or edit the React version:</b> double-click <b style="color:#f3efe6;white-space:nowrap">start-windows.bat</b> (Mac: <b style="color:#f3efe6;white-space:nowrap">start-mac.command</b>) in the project folder.</li>
                <li><b style="color:#f3efe6">To put it online:</b> upload these files to your Hostinger subdomain folder.</li>
              </ul>
            </div>
          </div>`;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
